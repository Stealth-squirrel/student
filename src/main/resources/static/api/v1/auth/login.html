<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Student — Вход</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
<form id="login-form" class="card login-card">
    <h1>Student System</h1>
    <input id="email"    type="email"    placeholder="Email"  required autocomplete="username">
    <input id="password" type="password" placeholder="Пароль" required autocomplete="current-password">
    <button type="submit">Войти</button>
    <p id="error" class="error"></p>
</form>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
