<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Пользователи</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<nav class="navbar">
    <span class="brand">Student System</span>
    <a href="users.html" class="active">Пользователи</a>
    <span class="spacer"></span>
    <span id="who" class="who"></span>
    <button class="link" onclick="logout()">Выйти</button>
</nav>
<main>
    <h1>Пользователи <span id="counter" class="counter"></span></h1>
    <form id="create-form" class="card row">
        <input id="f-email" type="email" placeholder="Email" required>
        <input id="f-pass"  type="password" placeholder="Пароль" required>
        <select id="f-role">
            <option value="ADMIN">ADMIN</option>
            <option value="TEACHER">TEACHER</option>
            <option value="SUPER_ADMIN">SUPER_ADMIN</option>
        </select>
        <button type="submit">Создать</button>
    </form>
    <p id="msg" class="error"></p>
    <table class="table">
        <thead><tr><th>ID</th><th>Email</th><th>Роли</th><th>Действия</th></tr></thead>
        <tbody id="tbody"></tbody>
    </table>
</main>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/users.js"></script>
</body>
</html>
